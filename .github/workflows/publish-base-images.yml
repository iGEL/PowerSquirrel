name: Publish base images

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - ".github/workflows/publish-base-images.yml"
      - "base/hub/**"
      - "base/connectors/sungrow_inverter/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: power-squirrel-hub
            context: base/hub
            dockerfile: base/hub/Dockerfile
          - image: power-squirrel-sungrow-inverter-connector
            context: base/connectors/sungrow_inverter
            dockerfile: base/connectors/sungrow_inverter/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Normalize image owner
        id: owner
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image }}
          tags: |
            type=raw,value=arm64,enable={{is_default_branch}}
            type=raw,value=latest-arm64,enable={{is_default_branch}}
            type=ref,event=branch,suffix=-arm64
            type=ref,event=tag,suffix=-arm64
            type=sha,prefix=sha-,suffix=-arm64

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64/v8
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}-arm64
          cache-to: type=gha,scope=${{ matrix.image }}-arm64,mode=max
